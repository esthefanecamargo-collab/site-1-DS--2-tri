
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu blog</title>

    <style>
        header {
            background-color: #a20656;
            color: bisque;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        main {
            background-color: hwb(348 38% 24%);
            color: bisque;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }

        article {
            display: flex;
        }

        img {
            width: 80px;
            height: 80px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Clube de unhas</h1>
        <p>venha se apaixonar pelas minhas unhas</p>
    </header>

    <main>
        <article>
            <div>
                <img src="./imagem-blog.png"
                     alt="Ilustração colorida de um salão de unhas">

                <h2>Meu primeiro desenho em unha</h2>
                <p>Bem-vindo ao meu salão de beleza</p>
                <p>Por: Esthefane Duarte</p>

                <button>🦋 <span>0</span></button>
                <button>💟 <span>0</span></button>
            </div>
        </article>

        <article>
            <div>
                <img src="./fazenda-borges-inicio-1-Paraiso-natural.avif"
                     alt="Paisagem natural de uma fazenda ao amanhecer">

                <h2>Minha primeira fazenda</h2>
                <p>Bem-vindo à minha fazenda</p>
                <p>Por: Esthefane Duarte</p>

                <button>🐴 <span>0</span></button>
                <button>🐄 <span>0</span></button>
            </div>
        </article>
    </main>

    <script>
        const botoes = document.querySelectorAll("main button");

        botoes.forEach(function(botao) {
            botao.addEventListener("click", function() {
                let texto = botao.querySelector("span");
                texto.textContent = Number(texto.textContent) + 1;
            });
        });
    </script>
</body>
</html>
